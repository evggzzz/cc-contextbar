<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" fill="none" role="img" aria-label="cc-contextbar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="240" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- battery logo -->
  <g transform="translate(70,80)">
    <rect x="0" y="0" width="254" height="80" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="258" y="22" width="9" height="36" rx="3" fill="#30363d"/>
    <!-- 10 segments: 6 filled, 4 empty -->
    <g filter="url(#glow)">
      <rect x="10" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
      <rect x="36" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
      <rect x="62" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
      <rect x="88" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
      <rect x="114" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
      <rect x="140" y="10" width="22" height="60" rx="5" fill="url(#fill)"/>
    </g>
    <rect x="166" y="10" width="22" height="60" rx="5" fill="#21262d"/>
    <rect x="192" y="10" width="22" height="60" rx="5" fill="#21262d"/>
    <rect x="218" y="10" width="22" height="60" rx="5" fill="#21262d"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision">
    <text x="380" y="118" font-size="66" font-weight="800">
      <tspan fill="#3fb950">cc</tspan><tspan fill="#f0f6fc">-contextbar</tspan>
    </text>
    <text x="382" y="158" font-size="22" font-weight="500" fill="#8b949e">
      Battery-style context-window statusline for Claude Code
    </text>
    <text x="382" y="190" font-size="17" font-weight="500" fill="#6e7681">
      🤖 model · [██████░░░░] usage% · $cost
    </text>
  </g>
</svg>
