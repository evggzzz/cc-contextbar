<svg xmlns="http://www.w3.org/2000/svg" width="840" height="130" viewBox="0 0 840 130" fill="none" role="img" aria-label="cc-contextbar statusline demo">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect width="840" height="130" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- traffic lights -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="22" r="6" fill="#27c93f"/>
  <text x="420" y="27" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#484f58">Claude Code</text>
  <line x1="14" y1="42" x2="826" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- statusline line -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-rendering="geometricPrecision">
    <!-- robot icon -->
    <g transform="translate(34,68)">
      <rect x="0" y="5" width="22" height="18" rx="5" fill="#6e7681"/>
      <circle cx="6.5" cy="14" r="2.4" fill="#3fb950"/>
      <circle cx="15.5" cy="14" r="2.4" fill="#3fb950"/>
      <circle cx="11" cy="3" r="2.2" fill="#3fb950"/>
    </g>
    <text x="74" y="92" font-size="20" fill="#c9d1d9">glm-5.2[1m]</text>
    <text x="222" y="92" font-size="20" fill="#484f58">·</text>

    <!-- battery bar: 5 filled / 5 empty = 52% -->
    <g>
      <rect x="248" y="78" width="16" height="16" rx="3" fill="url(#fill)"/>
      <rect x="266" y="78" width="16" height="16" rx="3" fill="url(#fill)"/>
      <rect x="284" y="78" width="16" height="16" rx="3" fill="url(#fill)"/>
      <rect x="302" y="78" width="16" height="16" rx="3" fill="url(#fill)"/>
      <rect x="320" y="78" width="16" height="16" rx="3" fill="url(#fill)"/>
      <rect x="338" y="78" width="16" height="16" rx="3" fill="#21262d"/>
      <rect x="356" y="78" width="16" height="16" rx="3" fill="#21262d"/>
      <rect x="374" y="78" width="16" height="16" rx="3" fill="#21262d"/>
      <rect x="392" y="78" width="16" height="16" rx="3" fill="#21262d"/>
      <rect x="410" y="78" width="16" height="16" rx="3" fill="#21262d"/>
    </g>
    <text x="438" y="92" font-size="20" fill="#c9d1d9">52%</text>
    <text x="490" y="92" font-size="20" fill="#484f58">·</text>
    <text x="512" y="92" font-size="20" fill="#3fb950">$1.23</text>
  </g>
</svg>
